<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Info</title>
    <style>
        .api-info {
            background: #fff3cd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="api-info">
        <h3>📡 API Usage</h3>
        <p><strong>Add data:</strong> <code>GET /data?temperature=25.5&humidity=60.2</code></p>
        <p><strong>View data:</strong> <code>GET /api/data</code></p>
        <p><strong>Clear data:</strong> <code>GET /clear</code></p>
    </div>
</body>
</html>
